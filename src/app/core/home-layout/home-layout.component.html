<div class="flex flex-col min-h-screen bg-gray-100 text-black">
  <!-- Header -->
  <header class="h-14 border-b border-border px-6 flex items-center">
    <nav class="flex w-full items-center justify-between">
      <!-- Brand -->
      <a class="text-lg font-semibold text-black">
        Daily Delta
      </a>

      <!-- Navigation -->
      <ul class="flex items-center gap-6 text-sm">
        <li>
           <div class="card flex justify-center">
            <p-menu #menu [model]="items" [popup]="true" />
            <p-button (click)="menu.toggle($event)" icon="pi pi-ellipsis-v" />
        </div>

        </li>


      </ul>
    </nav>
  </header>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto p-6">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="h-12 border-t border-border flex items-center justify-center text-xs text-black">
    © 2026 Daily delta. All Rights Reserved.
  </footer>
</div>
